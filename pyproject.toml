
[project]
name = "secure-message-gateway"
version = "0.1.0"
description = "Secure message gateway with HMAC signing and validation"
authors = [
    { name = "Ingrid Dinca", email = "dincaingrid24@gmail.com" }
]
requires-python = ">=3.10"

dependencies = [
    "PyQt6>=6.7,<7",
    "pytest>=8.0",
    "freezegun>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "strict"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

