[project]
name = "secure-message-gateway"
version = "1.1.0"
description = "Secure message gateway with HMAC signing and validation"
authors = [
    { name = "Ingrid Dinca", email = "dincaingrid24@gmail.com" }
]
requires-python = ">=3.10"

dependencies = [
    "PyQt6>=6.7,<7",
    "cryptography==42.0.5",
    "jsonschema==4.23.0",
    "aiofiles==23.1.0",
    "python-json-logger==2.0.7",
    "freezegun>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.5",
    "behave",
    "ruff==0.6.8",
    "mypy==1.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"