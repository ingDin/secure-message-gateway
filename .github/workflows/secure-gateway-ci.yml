
name: Secure Gateway CI (Windows Only)

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:

  # -------------------------------------------------
  # 1. Unit Tests
  # -------------------------------------------------
  unit-tests:
    runs-on: windows-latest
    name: Unit Tests (Windows)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -q

  # -------------------------------------------------
  # 2. Integration Tests
  # -------------------------------------------------
  integration-tests:
    runs-on: windows-latest
    name: Integration Tests (Windows)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration -q

  # -------------------------------------------------
  # 3. Acceptance Tests
  # -------------------------------------------------
  acceptance-tests:
    runs-on: windows-latest
    name: Acceptance Tests (Windows)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Behave
        run: python -m behave --no-capture

  # -------------------------------------------------
  # 4. Build Python Package
  # -------------------------------------------------
  build-package:
    runs-on: windows-latest
    name: Build Python Package (Windows)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
