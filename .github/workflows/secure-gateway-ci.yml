
name: Secure Message Gateway CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-asyncio==0.23.5

      - name: Verify pytest installation
        run: |
          python -m pip show pytest
          python -m pip show pytest-asyncio
          python -c "import pytest_asyncio; print('pytest-asyncio:', pytest_asyncio.__version__)"

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-asyncio==0.23.5

      - name: Diagnose pytest environment
        run: |
          python --version
          python -m pip show pytest
          python -m pip show pytest-asyncio
          python -c "import pytest; print('pytest:', pytest.__version__)"
          python -c "import pytest_asyncio; print('pytest-asyncio:', pytest_asyncio.__version__)"
          python -m pytest --version

      - name: Run integration tests
        run: python -m pytest tests/integration -q

  acceptance-tests:
    name: Acceptance Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-asyncio==0.23.5

      - name: Run Behave acceptance tests
        run: behave

  build-package:
    name: Build Python Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
